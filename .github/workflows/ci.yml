name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Lint with ruff
        run: ruff check . --exit-non-zero-on-fix

  test-fast:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run fast tests (excludes slow integration tests)
        env:
          FO_DATA_DIR: data
          ENABLE_SEC_ENRICHMENT: "false"
          ENABLE_WEB_ENRICHMENT: "false"
          REQUEST_DELAY_SEC: "0.0"
        run: |
          pytest tests/ -x -q --tb=short -m "not slow"

  test-slow:
    runs-on: ubuntu-latest
    needs: test-fast
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run slow integration tests
        env:
          FO_DATA_DIR: data
          ENABLE_SEC_ENRICHMENT: "true"
          ENABLE_WEB_ENRICHMENT: "false"
          REQUEST_DELAY_SEC: "0.0"
        run: |
          pytest tests/ -q --tb=short -m "slow"
